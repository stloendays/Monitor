name: Qt UI

concurrency:
  group: qt-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'cpp/**'
      - 'docs/DESKTOP_LIFECYCLE.md'
      - 'docs/QT_MIGRATION.md'
      - 'docs/WINDOWS_PACKAGING.md'
      - 'packaging/windows/**'
      - '.github/workflows/qt-ui.yml'

jobs:
  windows-qt:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: cpp/vcpkg.json

      - name: Install Qt 6
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O "$env:RUNNER_TEMP\Qt"

      - name: Configure Qt target
        shell: pwsh
        run: |
          $qt = Join-Path $env:RUNNER_TEMP "Qt\6.8.3\msvc2022_64"
          cmake -S cpp -B cpp/build-qt -DMONITOR_HUB_BUILD_QT=ON -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_PREFIX_PATH="$qt"

      - name: Build desktop targets
        shell: pwsh
        run: cmake --build cpp/build-qt --config Release --target monitor_hub_qt monitor_hub_cli

      - name: Desktop CLI smoke test
        shell: pwsh
        run: |
          & ".\cpp\build-qt\Release\monitor_hub_qt.exe" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ".\cpp\build-qt\Release\monitor_hub_qt.exe" --desktop-diagnostics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Package Windows desktop
        shell: pwsh
        run: |
          $qt = Join-Path $env:RUNNER_TEMP "Qt\6.8.3\msvc2022_64\bin"
          powershell -ExecutionPolicy Bypass -File packaging/windows/package_qt.ps1 -RepoRoot . -BuildDir cpp/build-qt -QtBin "$qt" -OutDir dist -BuildInstaller

      - name: Verify update package contract
        shell: pwsh
        run: |
          $verify = Join-Path $env:RUNNER_TEMP "MonitorHubUpdateVerify"
          if (Test-Path $verify) { Remove-Item $verify -Recurse -Force }
          Expand-Archive -LiteralPath .\dist\monitor-hub-windows-x64.zip -DestinationPath $verify
          $manifest = Get-Content (Join-Path $verify "manifest.json") -Raw | ConvertFrom-Json
          if ($manifest.format -ne 1) { throw "unsupported manifest format" }
          foreach ($entry in $manifest.files) {
            $path = Join-Path (Join-Path $verify "payload") ($entry.path -replace '/', '\')
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "missing payload file: $($entry.path)" }
            $item = Get-Item -LiteralPath $path
            if ($item.Length -ne [int64]$entry.size) { throw "size mismatch: $($entry.path)" }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if ($hash -ne [string]$entry.sha256) { throw "hash mismatch: $($entry.path)" }
          }
          if (-not (Test-Path (Join-Path $verify "payload\.monitor-hub-release.json"))) { throw "release marker missing" }
          $checksumPath = '.\dist\monitor-hub-windows-x64.zip.sha256'
          if (-not (Test-Path $checksumPath)) { throw "archive checksum missing" }
          $expected = ((Get-Content $checksumPath -Raw).Trim() -split '\\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 .\dist\monitor-hub-windows-x64.zip).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "archive checksum mismatch" }

      - name: Installed package smoke test
        shell: pwsh
        run: |
          & ".\dist\stage\bin\monitor_hub_qt.exe" --desktop-diagnostics
          if ($LASTEXITCODE -ne 0) { throw "staged diagnostics failed" }
          $version = (Get-Content ".\dist\stage\VERSION" -Raw).Trim()
          $installer = ".\dist\Monitor-Hub-$version-win64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "installer missing: $installer" }
          $installDir = Join-Path $env:RUNNER_TEMP "MonitorHubInstalled"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "installer failed: $($install.ExitCode)" }
          $installedExe = Join-Path $installDir "bin\monitor_hub_qt.exe"
          if (-not (Test-Path -LiteralPath $installedExe)) { throw "installed executable missing" }
          & $installedExe --desktop-diagnostics
          if ($LASTEXITCODE -ne 0) { throw "installed diagnostics failed" }
          $uninstaller = Join-Path $installDir "Uninstall.exe"
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "uninstaller failed: $($uninstall.ExitCode)" }
          Start-Sleep -Seconds 1
          if (Test-Path -LiteralPath $installedExe) { throw "installed executable remained after uninstall" }

      - name: Upload packaging artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monitor-hub-windows-package
          path: |
            dist/monitor-hub-windows-x64.zip
            dist/monitor-hub-windows-x64.zip.sha256
            dist/Monitor-Hub-*-win64-portable.zip
            dist/Monitor-Hub-*-win64-setup.exe
          if-no-files-found: error
