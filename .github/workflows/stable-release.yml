name: Stable Release

on:
  pull_request:
    paths:
      - 'VERSION'
      - 'cpp/CMakeLists.txt'
      - 'cpp/src/main.cpp'
      - 'cpp/src/qt_main.cpp'
      - 'packaging/windows/**'
      - 'docs/releases/**'
      - '.github/workflows/stable-release.yml'
  push:
    branches: [main]
    paths:
      - 'VERSION'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the VERSION on main as a stable GitHub Release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RELEASE_PUBLISH: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}

jobs:
  windows-stable-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release identity
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "VERSION is not SemVer: $version"
          }
          $tag = "v$version"
          $notes = "docs/releases/v$version.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "release notes missing: $notes"
          }

          "MONITOR_HUB_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MONITOR_HUB_RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MONITOR_HUB_RELEASE_NOTES=$notes" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          if ($env:RELEASE_PUBLISH -eq "true") {
            if ($env:GITHUB_REF -ne "refs/heads/main") {
              throw "stable releases may only publish from main; current ref: $env:GITHUB_REF"
            }
            git fetch origin main --tags --force
            git merge-base --is-ancestor $env:GITHUB_SHA origin/main
            if ($LASTEXITCODE -ne 0) {
              throw "release commit is not contained in origin/main"
            }
            $existing = git ls-remote --tags origin "refs/tags/$tag"
            if ($existing) {
              throw "release tag already exists: $tag"
            }
          }

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: cpp/vcpkg.json

      - name: Install Qt 6
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O "$env:RUNNER_TEMP\Qt"

      - name: Configure release build
        shell: pwsh
        run: |
          $qt = Join-Path $env:RUNNER_TEMP "Qt\6.8.3\msvc2022_64"
          cmake -S cpp -B cpp/build-release -DMONITOR_HUB_BUILD_QT=ON -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_PREFIX_PATH="$qt"

      - name: Build all release targets
        shell: pwsh
        run: cmake --build cpp/build-release --config Release

      - name: Run CTest
        shell: pwsh
        run: |
          $qtRoot = Join-Path $env:RUNNER_TEMP "Qt\6.8.3\msvc2022_64"
          $env:PATH = "$(Join-Path $qtRoot 'bin');$env:PATH"
          $env:QT_PLUGIN_PATH = Join-Path $qtRoot "plugins"
          ctest --test-dir cpp/build-release -C Release --output-on-failure

      - name: Verify compiled version contract
        shell: pwsh
        run: |
          $expected = $env:MONITOR_HUB_RELEASE_VERSION
          $cliVersion = (.\cpp\build-release\Release\monitor_hub_cli.exe --version | Out-String).Trim()
          if ($cliVersion -ne $expected) {
            throw "compiled CLI version mismatch: expected=$expected actual=$cliVersion"
          }
          $versionMatch = Select-String -LiteralPath .\cpp\build-release\CMakeCache.txt -Pattern '^CMAKE_PROJECT_VERSION:STATIC=(.+)$' | Select-Object -First 1
          if (-not $versionMatch) { throw "CMake cache did not report CMAKE_PROJECT_VERSION" }
          $cacheVersion = $versionMatch.Matches[0].Groups[1].Value.Trim()
          if ($cacheVersion -ne $expected) {
            throw "CMake project version mismatch: expected=$expected actual=$cacheVersion"
          }

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Package Windows desktop
        shell: pwsh
        run: |
          $qt = Join-Path $env:RUNNER_TEMP "Qt\6.8.3\msvc2022_64\bin"
          powershell -ExecutionPolicy Bypass -File packaging/windows/package_qt.ps1 -RepoRoot . -BuildDir cpp/build-release -QtBin "$qt" -OutDir dist -BuildInstaller

      - name: Verify release package contract
        shell: pwsh
        run: |
          $version = $env:MONITOR_HUB_RELEASE_VERSION
          $stagedVersion = (Get-Content -LiteralPath .\dist\stage\VERSION -Raw).Trim()
          if ($stagedVersion -ne $version) {
            throw "staged VERSION mismatch: expected=$version actual=$stagedVersion"
          }
          $marker = Get-Content -LiteralPath .\dist\stage\.monitor-hub-release.json -Raw | ConvertFrom-Json
          if ($marker.format -ne 1 -or $marker.version -ne $version -or $marker.entrypoint -ne "bin/monitor_hub_qt.exe") {
            throw "release marker does not match the stable desktop contract"
          }

          $verify = Join-Path $env:RUNNER_TEMP "MonitorHubStableUpdateVerify"
          if (Test-Path $verify) { Remove-Item $verify -Recurse -Force }
          Expand-Archive -LiteralPath .\dist\monitor-hub-windows-x64.zip -DestinationPath $verify
          $manifest = Get-Content (Join-Path $verify "manifest.json") -Raw | ConvertFrom-Json
          if ($manifest.format -ne 1 -or $manifest.version -ne $version) {
            throw "update manifest version/format mismatch"
          }
          foreach ($entry in $manifest.files) {
            $path = Join-Path (Join-Path $verify "payload") ($entry.path -replace '/', '\')
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "missing payload file: $($entry.path)" }
            $item = Get-Item -LiteralPath $path
            if ($item.Length -ne [int64]$entry.size) { throw "size mismatch: $($entry.path)" }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if ($hash -ne [string]$entry.sha256) { throw "hash mismatch: $($entry.path)" }
          }

      - name: Installed package smoke test
        shell: pwsh
        run: |
          function Invoke-Captured([string]$Path, [string]$Argument) {
            $startInfo = New-Object System.Diagnostics.ProcessStartInfo
            $startInfo.FileName = $Path
            $startInfo.Arguments = $Argument
            $startInfo.WorkingDirectory = Split-Path -Parent $Path
            $startInfo.UseShellExecute = $false
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            $startInfo.CreateNoWindow = $true
            $process = New-Object System.Diagnostics.Process
            $process.StartInfo = $startInfo
            try {
              if (-not $process.Start()) { throw "process did not start: $Path $Argument" }
              if (-not $process.WaitForExit(30000)) {
                try { $process.Kill() } catch {}
                throw "process timed out: $Path $Argument"
              }
              $stdout = $process.StandardOutput.ReadToEnd()
              $stderr = $process.StandardError.ReadToEnd()
              if ($process.ExitCode -ne 0) {
                throw "process failed ($($process.ExitCode)): $Path $Argument stdout=[$stdout] stderr=[$stderr]"
              }
              return $stdout.Trim()
            } finally {
              $process.Dispose()
            }
          }

          $version = $env:MONITOR_HUB_RELEASE_VERSION
          $stagedExe = ".\dist\stage\bin\monitor_hub_qt.exe"
          $stagedDiagnostics = Invoke-Captured $stagedExe "--desktop-diagnostics"
          if ($stagedDiagnostics -notmatch "version=$([regex]::Escape($version))") {
            throw "staged desktop diagnostics did not report version $version"
          }

          $installer = ".\dist\Monitor-Hub-$version-win64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "installer missing: $installer" }
          $installDir = Join-Path $env:RUNNER_TEMP "MonitorHubStableInstalled"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "installer failed: $($install.ExitCode)" }

          $installedExe = Join-Path $installDir "bin\monitor_hub_qt.exe"
          if (-not (Test-Path -LiteralPath $installedExe)) { throw "installed executable missing" }
          $installedDiagnostics = Invoke-Captured $installedExe "--desktop-diagnostics"
          if ($installedDiagnostics -notmatch "version=$([regex]::Escape($version))") {
            throw "installed desktop diagnostics did not report version $version"
          }

          $uninstaller = Join-Path $installDir "Uninstall.exe"
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "uninstaller failed: $($uninstall.ExitCode)" }
          Start-Sleep -Seconds 1
          if (Test-Path -LiteralPath $installedExe) { throw "installed executable remained after uninstall" }

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $version = $env:MONITOR_HUB_RELEASE_VERSION
          $assets = @(
            ".\dist\Monitor-Hub-$version-win64-setup.exe",
            ".\dist\Monitor-Hub-$version-win64-portable.zip",
            ".\dist\monitor-hub-windows-x64.zip"
          )
          $lines = foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "release asset missing: $asset"
            }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($asset))"
          }
          $lines | Set-Content -LiteralPath .\dist\SHA256SUMS.txt -Encoding ascii

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monitor-hub-${{ env.MONITOR_HUB_RELEASE_VERSION }}-windows-release
          path: |
            dist/Monitor-Hub-*-win64-setup.exe
            dist/Monitor-Hub-*-win64-portable.zip
            dist/monitor-hub-windows-x64.zip
            dist/monitor-hub-windows-x64.zip.sha256
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish stable GitHub Release
        if: env.RELEASE_PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:MONITOR_HUB_RELEASE_VERSION
          $tag = $env:MONITOR_HUB_RELEASE_TAG
          $notes = $env:MONITOR_HUB_RELEASE_NOTES
          $assets = @(
            ".\dist\Monitor-Hub-$version-win64-setup.exe#Windows installer (recommended)",
            ".\dist\Monitor-Hub-$version-win64-portable.zip#Portable Windows x64",
            ".\dist\monitor-hub-windows-x64.zip#Updater payload",
            ".\dist\monitor-hub-windows-x64.zip.sha256#Updater payload SHA-256",
            ".\dist\SHA256SUMS.txt#Release SHA-256 checksums"
          )
          gh release create $tag @assets --repo "${{ github.repository }}" --target "$env:GITHUB_SHA" --title "Monitor Hub $version" --notes-file $notes --latest
