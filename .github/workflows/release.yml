name: Release

concurrency:
  group: monitor-release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag, VERSION, and main ancestry
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Release tag must be vMAJOR.MINOR.PATCH: $tag" }
          $version = (Get-Content VERSION -Raw).Trim()
          if ($tag -ne "v$version") { throw "Tag $tag does not match VERSION=$version" }
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tag commit must already be contained in origin/main" }
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: cpp/vcpkg.json
      - name: Python updater checks
        shell: pwsh
        run: |
          python -m py_compile hub/monitor_hub.py hub/updater.py hub/apply_update.py hub/build_release.py tests/updater_test.py
          python tests/updater_test.py
      - name: Configure
        shell: pwsh
        run: cmake -S cpp -B cpp/build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build cpp/build --config Release
      - name: Test
        run: ctest --test-dir cpp/build -C Release --output-on-failure
      - name: Verify compiled version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $reported = (& .\cpp\build\Release\monitor_hub_cli.exe --version).Trim()
          if ($reported -ne $version) { throw "CLI version '$reported' != VERSION '$version'" }
      - name: Build release package
        shell: pwsh
        run: python hub/build_release.py --repo-root . --exe cpp/build/Release/monitor_hub_cli.exe --out dist --tag $env:GITHUB_REF_NAME
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/monitor-hub-windows-x64.zip dist/monitor-hub-windows-x64.zip.sha256 --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag dist/monitor-hub-windows-x64.zip dist/monitor-hub-windows-x64.zip.sha256 --verify-tag --generate-notes --title "Monitor Hub $tag" --repo $env:GITHUB_REPOSITORY
          }
