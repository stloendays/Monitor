name: C++ core

concurrency:
  group: cpp-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'cpp/**'
      - 'hub/**'
      - 'tests/**'
      - 'docs/MONITOR_NAMING.md'
      - '.github/workflows/cpp-core.yml'
  pull_request:
    paths:
      - 'cpp/**'
      - 'hub/**'
      - 'tests/**'
      - 'docs/MONITOR_NAMING.md'
      - '.github/workflows/cpp-core.yml'

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: cpp/vcpkg.json
      - name: Python contract checks
        shell: pwsh
        run: |
          python -m py_compile hub/monitor_hub.py hub/naming.py hub/status_contract.py hub/validate_status.py hub/claude_statusline_bridge.py tests/demo/make_demo.py tests/naming_test.py tests/status_contract_test.py tests/claude_statusline_bridge_test.py
          python tests/naming_test.py
          python tests/status_contract_test.py
          python tests/claude_statusline_bridge_test.py
          python hub/validate_status.py hub/hub_status.example.json
      - name: Configure
        shell: pwsh
        run: cmake -S cpp -B cpp/build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build cpp/build --config Release
      - name: Native Claude statusLine CLI smoke
        shell: pwsh
        run: |
          $hubData = Join-Path $env:RUNNER_TEMP "monitor-hub-native-claude"
          Remove-Item $hubData -Recurse -Force -ErrorAction SilentlyContinue
          $payload = '{"version":"test","session_id":"native-ci","model":{"id":"claude-test","display_name":"Claude Test"},"workspace":{"current_dir":"C:/ci","secret":"must-not-leak"},"rate_limits":{"five_hour":{"used_percentage":25,"resets_at":1788062400}},"oauth_token":"must-not-leak"}'
          $output = $payload | .\cpp\build\Release\monitor_hub_cli.exe --claude-statusline --hub-data $hubData
          if ($LASTEXITCODE -ne 0) {
            throw "native Claude statusLine CLI failed with exit code $LASTEXITCODE"
          }
          if (($output -join [Environment]::NewLine) -notmatch "Claude Test") {
            throw "native Claude statusLine CLI did not emit the expected display: $output"
          }
          $status = Join-Path $hubData "claude\cli_status.json"
          if (-not (Test-Path -LiteralPath $status)) {
            throw "native Claude statusLine CLI did not write $status"
          }
          $text = Get-Content -LiteralPath $status -Raw
          if ($text -match "must-not-leak" -or $text -match "oauth_token") {
            throw "native Claude statusLine snapshot leaked a non-allow-listed field"
          }
      - name: Live Windows probe CLI smoke
        shell: pwsh
        run: |
          $output = .\cpp\build\Release\monitor_hub_cli.exe --probe-system
          if ($LASTEXITCODE -ne 0) {
            throw "live Windows probe failed with exit code $LASTEXITCODE"
          }
          $probe = ($output -join [Environment]::NewLine) | ConvertFrom-Json
          if ($null -eq $probe.tasks -or $null -eq $probe.procs -or $null -eq $probe.error) {
            throw "raw probe JSON is missing tasks/procs/error"
          }
          if ($probe.error) {
            throw "live Windows probe reported an error: $($probe.error)"
          }
      - name: Test
        run: ctest --test-dir cpp/build -C Release --output-on-failure
